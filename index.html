<style>
/* Layout: một cột kiểu sổ tay trên điện thoại, thanh trên dính, thanh tab dưới cố định; trên máy tính căn giữa tối đa 560px */
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --line:#DADDD2; --ink:#1C2420; --muted:#66706A;
  --accent:#1F5C47; --accent-ink:#FFFFFF; --accent-soft:#E1ECE6;
  --owe:#B3432B; --owe-soft:#F7E5DF;        /* họ nợ bạn */
  --credit:#2C5BA3; --credit-soft:#E2EAF6;  /* bạn nợ họ */
  --font-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131816; --surface:#1B2220; --line:#2D3732; --ink:#E6EBE7; --muted:#95A199;
  --accent:#5DBB98; --accent-ink:#0D1913; --accent-soft:#1D3A2F;
  --owe:#EF8B72; --owe-soft:#3A231D; --credit:#88AEF0; --credit-soft:#1C2A41; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1B2220; --line:#2D3732; --ink:#E6EBE7; --muted:#95A199;
  --accent:#5DBB98; --accent-ink:#0D1913; --accent-soft:#1D3A2F;
  --owe:#EF8B72; --owe-soft:#3A231D; --credit:#88AEF0; --credit-soft:#1C2A41; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance;flex:1;min-width:0}
.back{border:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:18px;flex:none}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:4px 18px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sum .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sum .val{font-family:var(--font-display);font-size:22px;font-weight:700;margin-top:2px}
.sum.owe .val{color:var(--owe)} .sum.credit .val{color:var(--credit)}

.section-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px;display:flex;justify-content:space-between;gap:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:600;white-space:nowrap;text-align:right}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:2px}
.pill.owe{background:var(--owe-soft);color:var(--owe)}
.pill.credit{background:var(--credit-soft);color:var(--credit)}
.pill.zero{background:var(--accent-soft);color:var(--accent)}
.c-owe{color:var(--owe)} .c-credit{color:var(--credit)} .c-muted{color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--owe);border-color:var(--owe)}
.btn.danger.armed{background:var(--owe);color:var(--surface)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{border:0;background:none;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--accent);background:var(--accent-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.input.big{font-size:22px;font-weight:700;font-family:var(--font-display)}
.hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.share-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.share-row:first-child{border-top:0}
.share-row .n{flex:1;min-width:0}
.share-row .input{max-width:140px;text-align:right}
.preview{display:flex;justify-content:space-between;gap:8px;font-weight:600;padding-top:10px;border-top:1px solid var(--line);margin-top:6px}

.hero-bal{text-align:center;padding:18px 0 6px}
.hero-bal .lbl{color:var(--muted);font-size:13px}
.hero-bal .v{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.01em}
.ev{display:grid;grid-template-columns:84px 1fr auto;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0}
.ev .d{font-size:13px;color:var(--muted);padding-top:1px}
.ev .t{min-width:0;overflow-wrap:anywhere}
.ev .r{text-align:right;white-space:nowrap}
.ev .run{font-size:12px;color:var(--muted)}
.ev.settled{opacity:.55}
.divider{font-size:12px;color:var(--accent);text-align:center;padding:6px;background:var(--accent-soft)}

/* Hóa đơn: luôn nền giấy trắng để chụp ảnh gửi đi trông giống nhau */
.invoice{background:#FFFFFF;color:#1C2420;border-radius:16px;padding:20px 18px;border:1px solid var(--line)}
.invoice .ih{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:2px solid #1C2420;padding-bottom:10px}
.invoice .ih b{font-family:var(--font-display);font-size:22px}
.invoice .ih span{font-size:12px;color:#66706A;text-align:right}
.invoice .to{margin:12px 0 6px;font-size:13px;color:#66706A}
.invoice .to strong{display:block;color:#1C2420;font-size:18px}
.invoice table{width:100%;border-collapse:collapse;font-size:14px}
.invoice td{padding:7px 0;border-bottom:1px dashed #D6D9CF;vertical-align:top}
.invoice td.d{color:#66706A;width:92px}
.invoice td.a{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.invoice .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;gap:10px}
.invoice .tot b{font-family:var(--font-display);font-size:26px;color:#B3432B}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:16px;padding-top:14px;border-top:2px solid #1C2420;text-align:center}
.qr{background:#fff;padding:8px;line-height:0}
.qr img,.qr canvas{width:200px;height:200px}
.qrbox .bank{font-size:13px;color:#66706A}
.qrbox .bank b{color:#1C2420}

.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.inline-edit{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.skel{height:56px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
/* Bảng tháng: giống Google Sheet, cột Ngày dính bên trái, hàng tiêu đề dính trên cùng */
.wrap.wide{max-width:1200px}
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.months .chip{white-space:nowrap}
.sheet{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sheet table{border-collapse:separate;border-spacing:0;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
.sheet th,.sheet td{padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;text-align:right;background:var(--surface)}
.sheet th{position:sticky;top:0;z-index:2;font-size:13px;text-align:left;color:var(--muted)}
.sheet th button{border:0;background:none;padding:0;font-weight:700;color:var(--ink)}
.sheet .c-date{position:sticky;left:0;z-index:1;text-align:left;font-weight:600}
.sheet th.c-date{z-index:3}
.sheet td.t{text-align:left;white-space:normal;min-width:140px;max-width:240px}
.sheet td.paid{text-decoration:line-through;color:var(--credit)}
.sheet td.neg{color:var(--credit)}
.sheet td.done{color:var(--accent);font-weight:600;text-align:left}
.sheet .red{color:var(--owe)} .sheet .b{font-weight:700}
.sheet tr.click{cursor:pointer}
.sheet tr.click:hover td{background:var(--accent-soft)}
.sheet tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.wday{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.wday.we{background:var(--credit-soft);color:var(--credit)}
.sheet td[data-act="cell"]{cursor:text}
.sheet td.editing{padding:2px;background:var(--accent-soft)}
.cellin{width:100%;min-width:84px;border:1px solid var(--accent);background:var(--bg);border-radius:6px;padding:5px 6px;text-align:inherit}
.sheet tr.draft td{background:var(--accent-soft);padding:4px}
.sheet tr.draft .cellin{border-color:var(--line)}
.sheet tr.draft input[type=date]{min-width:136px}
.sheet td.t .cellin{min-width:150px}
.sheet .cellin.small{margin-top:4px;font-size:12px;min-width:0;width:auto}
.confirm{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ev .confirm .btn{padding:2px 8px;font-size:12px;margin-top:4px}
.row .confirm .btn{padding:6px 10px;font-size:13px}
.tabs .brand{display:none}
.monthbar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.monthbar .months{flex:1;min-width:0;padding-bottom:0}
.monthbar .back:disabled{opacity:.35;cursor:default}
.msum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.msum>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.msum .lbl{display:block;font-size:12px;color:var(--muted)}
.msum b{font-family:var(--font-display);font-size:18px}
.mstatus{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.mstatus .hint{flex:1;min-width:200px}
.sheet.locked tr.click{cursor:default}
@media (min-width:900px){
  body{padding-left:calc(232px + env(safe-area-inset-left,0px));padding-bottom:32px}
  .tabs{top:0;right:auto;width:208px;border-top:0;border-right:1px solid var(--line);
    padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .tabs .in{grid-template-columns:1fr;max-width:none;gap:4px}
  .tabs .brand{display:block;font-family:var(--font-display);font-size:20px;font-weight:700;padding:0 14px 16px}
  .tab{text-align:left;padding:10px 14px;font-size:15px}
  .fab{left:auto;transform:none;right:max(28px,env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px}
@media (min-width:900px){
  .tabs .brand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 16px 14px}
  .collapse{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none}
  .collapse:hover{color:var(--ink)}
  .tab{flex-direction:row;gap:10px}
  body.nav-min{padding-left:calc(92px + env(safe-area-inset-left,0px))}
  .nav-min .tabs{width:68px;padding-right:10px}
  .nav-min .tabs .brand{justify-content:center;padding:0 0 16px}
  .nav-min .brand-name,.nav-min .tab .lbl{display:none}
  .nav-min .tab{justify-content:center;padding:10px 0}
  .nav-min .collapse .ico{transform:rotate(180deg)}
}
@media (prefers-reduced-motion:no-preference){.tabs,body{transition:width .18s ease,padding-left .18s ease}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}
</style>

<script>
// Mã BIN theo chuẩn VietQR (NAPAS)
const BANKS=[["970436","Vietcombank"],["970415","VietinBank"],["970418","BIDV"],["970405","Agribank"],["970407","Techcombank"],
["970422","MB Bank"],["970416","ACB"],["970432","VPBank"],["970423","TPBank"],["970403","Sacombank"],["970441","VIB"],
["970437","HDBank"],["970443","SHB"],["970426","MSB"],["970448","OCB"],["970440","SeABank"],["970431","Eximbank"],
["970449","LPBank"],["970428","Nam A Bank"],["970409","Bac A Bank"],["970454","BVBank (Timo)"],["546034","CAKE by VPBank"],
["546035","Ubank by VPBank"],["970425","ABBANK"],["970452","KienlongBank"],["970412","PVcomBank"],["970427","VietABank"],
["970419","NCB"],["970400","Saigonbank"],["970438","BaoViet Bank"],["970429","SCB"],["970433","VietBank"],["970406","DongA Bank"],
["970408","GPBank"],["970430","PGBank"],["970424","Shinhan Bank"],["970457","Woori Bank"],["970458","UOB"],["458761","HSBC"]];
const ME="me";
const S={members:[],expenses:[],payments:[],settings:{},db:null,status:"loading",view:"sheet",month:"",months:[],p:{},dirty:false};
let form=null;
const $app=document.getElementById("app");

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("vi-VN")+" đ";
const fmtNum=n=>n?Math.round(n).toLocaleString("vi-VN"):"";
function parseMoney(s){
  s=String(s||"").trim().toLowerCase().replace(/\s/g,"");
  let mult=1;
  if(/k$/.test(s)){mult=1000;s=s.slice(0,-1);}
  else if(/(tr|m)$/.test(s)){mult=1e6;s=s.replace(/(tr|m)$/,"");}
  if(mult>1){const v=parseFloat(s.replace(",",".").replace(/[^\d.]/g,""));return isNaN(v)?0:Math.round(v*mult);}
  const d=s.replace(/[^\d]/g,"");return d?parseInt(d,10):0;
}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const dmy=d=>d?d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4):"";
const dm=dmy;
const monthLabel=ym=>"Tháng "+parseInt(ym.slice(5,7),10)+"/"+ym.slice(0,4);
const myName=()=>S.settings.myName||"Tôi";
function nameOf(id){if(id===ME)return myName();const m=S.members.find(x=>x.id===id);return m?m.name:"(đã xóa)";}
const initials=n=>(n||"?").trim().split(/\s+/).slice(-1)[0].slice(0,2).toUpperCase();
const sumShares=e=>Object.values(e.shares||{}).reduce((a,b)=>a+(+b||0),0);
// Số dư so với bạn: dương = họ nợ bạn, âm = bạn nợ họ
const deltaFor=(e,m)=>(e.shares?.[m]||0)-(e.payerId===m?sumShares(e):0);
const sortKey=x=>(x.date||"")+String(x.createdAt||0).padStart(15,"0");

function balances(){
  const b={};S.members.forEach(m=>b[m.id]=0);
  for(const e of S.expenses){
    const ids=new Set(Object.keys(e.shares||{}));if(e.payerId)ids.add(e.payerId);
    for(const id of ids){if(id!==ME)b[id]=(b[id]||0)+deltaFor(e,id);}
  }
  for(const p of S.payments)b[p.memberId]=(b[p.memberId]||0)-(+p.amount||0);
  return b;
}
function timeline(mid){
  const ev=[];
  for(const e of S.expenses){
    if(!(e.shares&&mid in e.shares)&&e.payerId!==mid)continue;
    const delta=deltaFor(e,mid);
    const payer=e.payerId===mid?"Bạn ấy trả hộ "+fmt(sumShares(e)):(e.payerId===ME?"":nameOf(e.payerId)+" trả");
    ev.push({kind:"exp",id:e.id,date:e.date,createdAt:e.createdAt,title:e.title,sub:payer,delta});
  }
  for(const p of S.payments){
    if(p.memberId!==mid)continue;
    ev.push({kind:"pay",id:p.id,date:p.date,createdAt:p.createdAt,title:p.note||(p.amount>=0?"Đã trả tiền":"Bạn trả lại"),sub:"",delta:-(+p.amount||0)});
  }
  ev.sort((a,b)=>sortKey(a)<sortKey(b)?-1:1);
  let run=0,lastZero=-1;
  ev.forEach((x,i)=>{run+=x.delta;x.run=run;if(Math.abs(run)<1)lastZero=i;});
  // Gạch ngang như bảng tính: tiền đã trả được trừ dần vào các khoản cũ nhất trước
  const credit=ev.reduce((a,x)=>x.delta<0?a-x.delta:a,0);
  let cum=0;ev.forEach(x=>{if(x.delta>0){cum+=x.delta;x.paid=cum<=credit+0.5;}});
  return {ev,lastZero,balance:run,credit};
}

const nextYm=ym=>{let y=+ym.slice(0,4),m=+ym.slice(5,7)+1;if(m>12){m=1;y++;}return y+"-"+String(m).padStart(2,"0");};

    <div><span class="lbl">Đã tất toán</span><b class="num">${settled}/${active.length} người</b></div></div>

  const editing=(id,key)=>S.edit&&S.edit.eid===id&&S.edit.key===key;
  const cellIn=v=>`<td class="editing"><input class="cellin num" id="cell-edit" inputmode="decimal" value="${esc(v)}"></td>`;
  const cellAt=(id,key)=>locked?"":`data-act="cell" data-id="${esc(id)}" data-key="${esc(key)}"`;
  const rowAct=(act)=>locked?`data-act="locked"`:act;
  const dayCells=(d,show)=>show?`<td class="c-date">${dmy(d)}</td><td><span class="wday ${/Thứ 7|Chủ/.test(wd(d))?"we":""}">${wd(d)}</span></td>`:`<td class="c-date"></td><td></td>`;

        editing(x.id,m.id)?cellIn(fmtNum(x.shares?.[m.id])):cell(info[m.id].byId["exp"+x.id],cellAt(x.id,m.id))).join("")}</tr>`;

  // Dòng trống để gõ khoản chi mới, giống gõ thêm một hàng trong Excel
  if(!locked){
    if(!S.draft||S.draft.month!==ym)S.draft={month:ym,date:inM(today())?today():start,title:"",payerId:ME,vals:{}};

  }
  t+=`<tr class="sum"><td class="c-date"></td><td></td><td class="t red">Tổng</td><td>${mineTot?money(mineTot):""}</td>${cols.map(m=>{const i=info[m.id],v=i.end;

    +`<button class="fab" data-act="new-exp">+ Thêm khoản chi</button>`;
}
function invoiceData(mid,pm){
  const {ev,lastZero,balance}=timeline(mid);
  if(!pm)return {items:ev.slice(lastZero+1),balance,label:""};
  let carry=0;const items=[];
  for(const x of ev){if(x.date<pm+"-01")carry+=x.delta;else if(x.date.startsWith(pm))items.push(x);}
  if(Math.abs(carry)>=1)items.unshift({date:"",title:"Nợ cũ",delta:carry});
  return {items,balance:items.reduce((a,x)=>a+x.delta,0),label:monthLabel(pm)};
}

  if(f.mode==="equal"){

  }else{

function computeShares(){
  const f=form;const shares={};
  if(f.mode==="equal"){const t=parseMoney(f.amountStr);const n=f.parts.length;if(n&&t)f.parts.forEach(id=>shares[id]=Math.round(t/n));}
  else f.parts.forEach(id=>{const v=parseMoney(f.custom[id]);if(v)shares[id]=v;});
  return shares;
}
function updatePreview(){
  const el=document.getElementById("f-preview");if(!el||!form)return;
  const sh=computeShares();const ids=Object.keys(sh);
  if(!ids.length){el.innerHTML=`<p class="hint">Nhập số tiền và chọn người tham gia để xem mỗi người phải trả bao nhiêu.</p>`;return;}
  const tot=ids.reduce((a,id)=>a+sh[id],0);
  el.innerHTML=(form.mode==="equal"?`<p class="hint">Mỗi người ${fmt(sh[ids[0]])} × ${ids.length} người</p>`:"")
    +`<div class="preview"><span>Tổng</span><span class="num">${fmt(tot)}</span></div>`
    +(form.payerId!==ME?`<p class="hint" style="margin-top:6px">${esc(nameOf(form.payerId))} trả hộ, nên sẽ được trừ ${fmt(tot-(sh[form.payerId]||0))}${sh[ME]?" (gồm phần của bạn)":""}.</p>`:"");
}

  document.getElementById("tabs").hidden=["expense"].includes(S.view);
  ["sheet","home","members"].forEach(v=>document.getElementById("tab-"+v).classList.toggle("on",S.view===v||(v==="home"&&["person","invoice"].includes(S.view))));

  if(S.status==="nodb"){$app.innerHTML=topBar("Sổ Ghi Nợ")+`<div class="card empty"><b>Chưa kết nối được nơi lưu dữ liệu</b>Hãy mở app này trên claude.ai khi đã đăng nhập tài khoản của bạn. Dữ liệu sổ nợ được lưu trong tài khoản đó.</div>`;return;}

}
function softRender(){
  const a=document.activeElement;
  if(a&&$app.contains(a)&&a.matches("input,select,textarea")){
    if(!a.dataset.draft){S.dirty=true;return;}
    const k=a.dataset.draft,pos=a.selectionStart;render();
    const b=$app.querySelector('[data-draft="'+CSS.escape(k)+'"]');
    if(b){b.focus();try{b.setSelectionRange(pos,pos);}catch{}}
    return;
  }
  render();
}

// ---------- VietQR ----------
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c.toString(16).toUpperCase().padStart(4,"0");}
const ascii=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9 ]/g,"").trim();
function vietqr(bin,acc,amount,memo){
  let p=tlv("00","01")+tlv("01",amount?"12":"11")+tlv("38",tlv("00","A000000727")+tlv("01",tlv("00",bin)+tlv("01",acc))+tlv("02","QRIBFTTA"))+tlv("53","704");
  if(amount)p+=tlv("54",String(Math.round(amount)));
  p+=tlv("58","VN");
  if(memo)p+=tlv("62",tlv("08",memo.slice(0,25)));
  p+="6304";return p+crc16(p);
}
function drawQR(){
  const el=document.getElementById("qr");if(!el)return;
  const st=S.settings;const m=S.members.find(x=>x.id===S.p.mid);const {balance}=invoiceData(S.p.mid,S.p.pm);
  if(typeof QRCode==="undefined"){el.textContent="Không tải được mã QR";return;}
  new QRCode(el,{text:vietqr(st.bankBin,String(st.accountNo).replace(/\s/g,""),balance,ascii("Tra no "+(m?m.name:""))),width:400,height:400,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}

// ---------- Ghi dữ liệu ----------
async function write(fn,okMsg){
  if(!S.db){toast("Chưa kết nối được nơi lưu dữ liệu");return false;}
  try{await fn(S.db);if(okMsg)toast(okMsg);return true;}
  catch(e){toast(e&&e.code==="quota_exceeded"?"Sổ đã đầy, hãy xóa bớt dữ liệu cũ":"Chưa lưu được, thử lại sau ít giây");return false;}
}
const armed=new Set();
// Bấm lần đầu: thay nút bằng cặp "Xác nhận" / "Hủy"; chỉ khi bấm Xác nhận mới thực hiện
function confirmTap(btn,key,label){
  if(armed.has(key)){armed.delete(key);return true;}
  armed.add(key);
  const box=document.createElement("span");box.className="confirm";
  box.innerHTML=`<button class="btn danger armed" data-confirm="yes">${esc(label)}</button><button class="btn" data-confirm="no">Hủy</button>`;
  btn.hidden=true;btn.after(box);box.querySelector('[data-confirm="no"]').focus();
  box.addEventListener("click",e=>{
    e.stopPropagation();const c=e.target.closest("[data-confirm]");if(!c)return;
    box.remove();btn.hidden=false;
    if(c.dataset.confirm==="yes")btn.click();else armed.delete(key);
  });
  return false;
}
function openExpense(e,from,mid){
  form=e?{id:e.id,date:e.date,title:e.title,payerId:e.payerId,parts:Object.keys(e.shares||{}),mode:e.mode||"equal",
      amountStr:e.mode==="custom"?"":fmtNum(sumShares(e)),custom:Object.fromEntries(Object.entries(e.shares||{}).map(([k,v])=>[k,fmtNum(v)])),createdAt:e.createdAt}
    :{date:today(),title:"",payerId:ME,parts:[ME],mode:"equal",amountStr:"",custom:{}};
  go("expense",{from:from||S.view,mid});
}

document.addEventListener("input",ev=>{
  const t=ev.target;if(!form||S.view!=="expense")return;
  if(t.id==="f-title")form.title=t.value;
  else if(t.id==="f-date")form.date=t.value;
  else if(t.id==="f-amount")form.amountStr=t.value;
  else if(t.dataset.share)form.custom[t.dataset.share]=t.value;
  updatePreview();
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="f-payer"&&form){form.payerId=ev.target.value;if(!form.parts.includes(form.payerId)&&form.payerId===ME){}updatePreview();}
});

document.addEventListener("click",async ev=>{
  if(ev.target.closest("input,select"))return;
  const el=ev.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="go")return go(el.dataset.view,{mid:el.dataset.mid,pm:el.dataset.pm||""});
  if(a==="month"){S.month=el.dataset.month;return render();}
  if(a==="pmonth"){S.p.pm=el.dataset.month;return render();}
  if(a==="locked")return toast(closedMsg);
  if(a==="month-step"){const ms=sheetMonths(),i=ms.indexOf(S.month)+(+el.dataset.step);if(ms[i]){S.month=ms[i];render();}return;}
  if(a==="new-month"){
    const ms=sheetMonths(),ym=nextYm(ms[ms.length-1]);
    if(await write(db=>db.doc("months/"+ym).set({closed:false,createdAt:Date.now()}),"Đã tạo "+monthLabel(ym).toLowerCase())){S.month=ym;render();}
    return;
  }
  if(a==="close-month"){
    if(!confirmTap(el,"close-"+S.month,"Chốt sổ "+monthLabel(S.month).toLowerCase()))return;
    await write(db=>db.doc("months/"+S.month).set({closed:true,closedAt:Date.now()}),"Đã chốt sổ");return;
  }
  if(a==="open-month"){
    if(!confirmTap(el,"open-"+S.month,"Mở khóa để sửa"))return;
    await write(db=>db.doc("months/"+S.month).set({closed:false,openedAt:Date.now()}),"Đã mở khóa");return;
  }
  if(a==="nav-toggle")return setNavMin(!document.body.classList.contains("nav-min"));
  if(a==="cell")return startCell(id,el.dataset.key);
  if(a==="draft-save")return saveDraft();
  if(a==="new-exp")return openExpense(null,S.view==="person"?"person":S.view,S.p.mid);
  if(a==="edit-exp"){const e=S.expenses.find(x=>x.id===id);if(e&&isClosed(e.date.slice(0,7)))return toast(closedMsg);if(e)openExpense(e,S.view,S.p.mid);return;}
  if(a==="toggle-part"){const i=form.parts.indexOf(id);i<0?form.parts.push(id):form.parts.splice(i,1);return render();}
  if(a==="parts-all"){form.parts=[ME,...S.members.filter(m=>!m.hidden).map(m=>m.id)];return render();}
  if(a==="parts-none"){form.parts=[];return render();}
  if(a==="mode"){
    const mode=el.dataset.mode;if(mode===form.mode)return;
    if(mode==="custom"){const sh=computeShares();form.custom=Object.fromEntries(Object.entries(sh).map(([k,v])=>[k,fmtNum(v)]));}
    else{form.amountStr=fmtNum(Object.values(computeShares()).reduce((x,y)=>x+y,0));}
    form.mode=mode;return render();
  }
  if(a==="save-exp"){
    const f=form;const shares=computeShares();
    if(!f.title.trim())return toast("Nhập nội dung khoản chi");
    if(!Object.keys(shares).length)return toast("Nhập số tiền và chọn người tham gia");
    if(!f.date)return toast("Chọn ngày");
    if(isClosed(f.date.slice(0,7))||(f.id&&(id=>isClosed((S.expenses.find(x=>x.id===id)?.date||"").slice(0,7)))(f.id)))return toast(closedMsg);
    const data={date:f.date,title:f.title.trim(),payerId:f.payerId,mode:f.mode,shares,total:Object.values(shares).reduce((x,y)=>x+y,0),createdAt:f.createdAt||Date.now(),updatedAt:Date.now()};
    const ok=await write(db=>f.id?db.doc("expenses/"+f.id).set(data):db.collection("expenses").add(data),f.id?"Đã lưu thay đổi":"Đã thêm khoản chi");
    if(ok){form=null;go(S.p.from||"home",{mid:S.p.mid});}
    return;
  }
  if(a==="del-exp"){
    if((id=>isClosed((S.expenses.find(x=>x.id===id)?.date||"").slice(0,7)))(form.id))return toast(closedMsg);
    if(!confirmTap(el,"del-exp","Xác nhận xóa"))return;
    const ok=await write(db=>db.doc("expenses/"+form.id).delete(),"Đã xóa khoản chi");
    if(ok){form=null;go(S.p.from||"home",{mid:S.p.mid});}
    return;
  }
  if(a==="paydir"){S.p.payDir=el.dataset.dir;return render();}
  if(a==="pay-save"){
    const amt=parseMoney(document.getElementById("pay-amt").value);
    if(!amt)return toast("Nhập số tiền");
    if(isClosed(today().slice(0,7)))return toast(closedMsg);
    const dir=S.p.payDir||(timeline(S.p.mid).balance<0?"out":"in");
    await write(db=>db.collection("payments").add({memberId:S.p.mid,amount:dir==="in"?amt:-amt,date:today(),note:"",createdAt:Date.now()}),"Đã ghi nhận trả tiền");
    return;
  }
  if(a==="settle"){
    const {balance}=timeline(S.p.mid);if(Math.abs(balance)<1)return;
    if(isClosed(today().slice(0,7)))return toast(closedMsg);
    if(!confirmTap(el,"settle","Tất toán "+fmt(Math.abs(balance))))return;
    await write(db=>db.collection("payments").add({memberId:S.p.mid,amount:Math.round(balance),date:today(),note:"Tất toán",createdAt:Date.now()}),"Đã tất toán");
    return;
  }
  if(a==="del-pay"){
    ev.stopPropagation();
    if(isClosed((S.payments.find(x=>x.id===id)?.date||"").slice(0,7)))return toast(closedMsg);
    if(!confirmTap(el,"del-pay-"+id,"Xác nhận xóa"))return;
    await write(db=>db.doc("payments/"+id).delete(),"Đã xóa");return;
  }
  if(a==="copy-inv"){
    const m=S.members.find(x=>x.id===S.p.mid);const {items,balance,label}=invoiceData(S.p.mid,S.p.pm);const st=S.settings;const bank=BANKS.find(b=>b[0]===st.bankBin);
    const txt=["Hóa đơn gửi "+(m?m.name:"")+(label?" ("+label+")":""),...items.map(x=>dm(x.date)+" "+x.title+": "+(x.delta<0?"-":"")+fmt(Math.abs(x.delta))),
      (balance>=0?"Cần trả: ":"Mình trả lại: ")+fmt(Math.abs(balance)),st.accountNo?"STK: "+st.accountNo+" "+(bank?bank[1]:"")+" - "+(st.accountName||""):""].filter(Boolean).join("\n");
    try{await navigator.clipboard.writeText(txt);toast("Đã sao chép");}catch{toast("Máy không cho sao chép, hãy chụp màn hình");}
    return;
  }
  if(a==="add-member"){
    const inp=document.getElementById("new-member");const name=inp.value.trim();if(!name)return toast("Nhập tên");
    if(S.members.some(m=>m.name.toLowerCase()===name.toLowerCase()))return toast("Tên này đã có");
    const ok=await write(db=>db.collection("members").add({name,hidden:false,createdAt:Date.now()}),"Đã thêm "+name);
    if(ok){inp.value="";render();}return;
  }
  if(a==="edit-name"){S.p.editMid=id;render();const i=document.getElementById("edit-name");if(i){i.focus();i.select();}return;}
  if(a==="rename"){
    const name=document.getElementById("edit-name").value.trim();if(!name)return toast("Nhập tên");
    const ok=await write(db=>db.doc("members/"+id).update({name}),"Đã đổi tên");if(ok){S.p.editMid=null;render();}return;
  }
  if(a==="hide"){const m=S.members.find(x=>x.id===id);await write(db=>db.doc("members/"+id).update({hidden:!m.hidden}),m.hidden?"Đã hiện lại":"Đã ẩn");return;}
  if(a==="del-member"){if(!confirmTap(el,"delm-"+id,"Xác nhận xóa"))return;await write(db=>db.doc("members/"+id).delete(),"Đã xóa");return;}
  if(a==="save-settings"){
    const data={myName:document.getElementById("s-name").value.trim(),bankBin:document.getElementById("s-bank").value,
      accountNo:document.getElementById("s-acc").value.replace(/\s/g,""),accountName:ascii(document.getElementById("s-holder").value).toUpperCase()};
    if(data.accountNo&&!/^\d{4,20}$/.test(data.accountNo))return toast("Số tài khoản chỉ gồm chữ số");
    await write(db=>db.doc("settings/main").set(data),"Đã lưu thông tin");return;
  }
  if(a==="export"){
    const json=JSON.stringify({exportedAt:new Date().toISOString(),members:S.members,expenses:S.expenses,payments:S.payments,settings:S.settings},null,2);
    const dl=await window.claude?.use?.("downloads");
    if(dl){try{await dl.save({filename:"so-ghi-no-"+today()+".json",data:json});toast("Đã xuất dữ liệu");}catch(e){if(e?.code!=="declined")toast("Chưa xuất được file");}}
    else{try{await navigator.clipboard.writeText(json);toast("Đã sao chép dữ liệu vào bộ nhớ tạm");}catch{toast("Chưa xuất được dữ liệu ở đây");}}
    return;
  }
});
document.addEventListener("keydown",ev=>{
  const t=ev.target;
  if(t.id==="cell-edit"&&(ev.key==="Enter"||ev.key==="Escape")){ev.preventDefault();return commitCell(ev.key==="Enter");}
  if(t.dataset&&t.dataset.draft&&ev.key==="Enter"){ev.preventDefault();return saveDraft();}
  if(ev.key!=="Enter")return;
  const id=ev.target.id;
  if(id==="new-member")document.querySelector('[data-act="add-member"]')?.click();
  if(id==="pay-amt")document.querySelector('[data-act="pay-save"]')?.click();
  if(id==="edit-name")document.querySelector('[data-act="rename"]')?.click();
});

// ---------- Gõ trực tiếp trong Bảng ----------
function startCell(id,key){
  const e=S.expenses.find(x=>x.id===id);if(e&&isClosed(e.date.slice(0,7)))return toast(closedMsg);
  S.edit={eid:id,key};render();
  const i=document.getElementById("cell-edit");if(i){i.focus();i.select();}
}
let committing=false;
async function commitCell(save){
  if(!S.edit||committing)return;
  const {eid,key}=S.edit;const i=document.getElementById("cell-edit");const e=S.expenses.find(x=>x.id===eid);
  S.edit=null;
  if(!save||!i||!e)return render();
  const data={...e};delete data.id;data.shares={...(e.shares||{})};
  if(key==="title"){const v=i.value.trim();if(!v||v===e.title)return render();data.title=v;}
  else{
    const v=parseMoney(i.value);if((data.shares[key]||0)===v)return render();
    if(v)data.shares[key]=v;else delete data.shares[key];
    if(!Object.keys(data.shares).length){toast("Khoản chi phải có ít nhất một người");return render();}
    data.mode="custom";data.total=sumShares(data);
  }
  data.updatedAt=Date.now();
  committing=true;await write(db=>db.doc("expenses/"+eid).set(data),"Đã lưu");committing=false;
  S.edit?startCell(S.edit.eid,S.edit.key):render();
}
async function saveDraft(){
  const d=S.draft;if(!d)return;const shares={};
  for(const [k,v] of Object.entries(d.vals)){const n=parseMoney(v);if(n)shares[k]=n;}
  if(!d.title.trim())return toast("Gõ nội dung khoản chi");
  if(!Object.keys(shares).length)return toast("Gõ số tiền vào ô của ít nhất một người");
  if(!d.date)return toast("Chọn ngày");
  if(isClosed(d.date.slice(0,7)))return toast(closedMsg);
  const ok=await write(db=>db.collection("expenses").add({date:d.date,title:d.title.trim(),payerId:d.payerId,mode:"custom",shares,
    total:Object.values(shares).reduce((x,y)=>x+y,0),createdAt:Date.now(),updatedAt:Date.now()}),"Đã thêm dòng");
  if(ok){S.month=d.date.slice(0,7);S.draft={...d,month:S.month,title:"",vals:{}};render();document.getElementById("draft-title")?.focus();}
}
document.addEventListener("input",ev=>{
  const k=ev.target.dataset&&ev.target.dataset.draft;if(!k||!S.draft)return;
  if(k==="title")S.draft.title=ev.target.value;
  else if(k!=="date"&&k!=="payer")S.draft.vals[k]=ev.target.value;
});
document.addEventListener("change",ev=>{
  const k=ev.target.dataset&&ev.target.dataset.draft;if(!k||!S.draft)return;
  if(k==="payer")S.draft.payerId=ev.target.value;
  if(k==="date"){S.draft.date=ev.target.value;render();}
});
document.addEventListener("focusout",ev=>{if(ev.target.id==="cell-edit")commitCell(true);});

// ---------- Thu gọn menu (nhớ trên máy này) ----------
function setNavMin(on){
  document.body.classList.toggle("nav-min",on);
  const b=document.getElementById("nav-toggle"),t=on?"Mở rộng menu":"Thu gọn menu";
  b.setAttribute("aria-label",t);b.title=t;
  try{localStorage.setItem("navMin",on?"1":"");}catch{}
}
try{if(localStorage.getItem("navMin"))setNavMin(true);}catch{}

// ---------- Khởi động ----------
async function boot(){
  render();
  const db=window.claude?.use?await window.claude.use("db").catch(()=>null):null;
  if(!db){S.status="nodb";render();return;}
  S.db=db;
  let pending=5;const first=()=>{if(--pending===0){S.status="ready";render();}};
  const onErr=()=>{};
  const sub=(name)=>{let got=false;db.collection(name).onSnapshot(snap=>{
    S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!got){got=true;first();}else softRender();
  },onErr);};
  sub("members");sub("expenses");sub("payments");sub("months");
  let gotS=false;
  db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};if(!gotS){gotS=true;first();}else softRender();},onErr);
}
boot();
</script>
